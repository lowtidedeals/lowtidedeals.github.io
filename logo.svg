<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#17507a"/>
      <stop offset="0.55" stop-color="#0b2f4d"/>
      <stop offset="1" stop-color="#051726"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc58f"/>
      <stop offset="1" stop-color="#ff6a4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b5e"/>
      <stop offset="1" stop-color="#04131f"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#041422" flood-opacity="0.75"/>
    </filter>
    <clipPath id="above"><rect x="0" y="0" width="1000" height="600"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#sky)"/>
  <g transform="translate(0,-30)">

  <!-- sunset glow and sun, cut off at the horizon -->
  <circle cx="500" cy="600" r="330" fill="url(#glow)"/>
  <circle cx="500" cy="600" r="165" fill="url(#sun)" clip-path="url(#above)"/>

  <!-- water -->
  <rect x="0" y="600" width="1000" height="430" fill="url(#sea)"/>
  <rect x="0" y="598" width="1000" height="5" fill="#ffb07f" opacity="0.55"/>
  <!-- sun reflection -->
  <g stroke="#ff9466" stroke-linecap="round">
    <line x1="400" y1="636" x2="600" y2="636" stroke-width="16" opacity="0.75"/>
    <line x1="435" y1="668" x2="565" y2="668" stroke-width="13" opacity="0.5"/>
    <line x1="468" y1="696" x2="532" y2="696" stroke-width="10" opacity="0.3"/>
  </g>

  <!-- waves -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 770 q 58 -42 116 0 t 116 0 t 116 0 t 116 0 t 116 0 t 116 0" stroke="#2ec4b6" stroke-width="38"/>
    <path d="M215 858 q 47 -34 95 0 t 95 0 t 95 0 t 95 0 t 95 0 t 95 0" stroke="#2ec4b6" stroke-width="30" opacity="0.55"/>
  </g>

  <!-- price history line dropping to its lowest point at the horizon -->
  <g filter="url(#lift)">
  <polyline points="205,300 330,372 425,330 560,470 650,438 760,592"
            fill="none" stroke="#effcf9" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="760" cy="592" r="46" fill="#effcf9"/>
  <circle cx="760" cy="592" r="24" fill="#ff6a4d"/>
  </g>
  </g>
</svg>
